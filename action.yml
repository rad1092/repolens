name: RepoLens
description: Block new Node and GitHub repository-maintenance regressions with a reviewed baseline.
author: rad1092

branding:
  icon: search
  color: blue

inputs:
  target:
    description: Repository path relative to GITHUB_WORKSPACE.
    required: false
    default: "."
  config:
    description: Optional .repolens.json path relative to GITHUB_WORKSPACE.
    required: false
    default: ""
  baseline:
    description: Optional RepoLens JSON baseline path relative to GITHUB_WORKSPACE.
    required: false
    default: ""
  fail-on:
    description: none, critical, warning, new-critical, or new-warning. Overrides config.
    required: false
    default: ""

outputs:
  critical:
    description: New or worsened critical regression count.
  warning:
    description: New or worsened warning regression count.
  unknown:
    description: New or worsened unknown coverage count.
  new:
    description: Total new or worsened regression count.
  accepted:
    description: Current finding count accepted by the reviewed baseline.
  ignored:
    description: Current finding count ignored by unexpired reviewed config.
  passed:
    description: Whether the configured maintenance policy passed.
  report-json:
    description: Absolute path to the JSON report.
  report-html:
    description: Absolute path to the standalone HTML report.
  report-markdown:
    description: Absolute path to the GitHub-flavored Markdown summary.
  report-sarif:
    description: Absolute path to the SARIF 2.1.0 regression report.

runs:
  using: node24
  main: action/index.cjs
