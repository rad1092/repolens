name: Release CLI package

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Verify Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.11.0", "22", "24"]
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify CLI, Action, package, and reports
        run: npm run ci

  source:
    name: Verify tag source
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag commit belongs to the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin \
            "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          tag_commit="$(git rev-parse "$GITHUB_REF_NAME^{commit}")"
          if ! git merge-base --is-ancestor \
            "$tag_commit" "refs/remotes/origin/$DEFAULT_BRANCH"; then
            echo "::error title=Untrusted release tag::The tag commit is not in the default branch history."
            exit 1
          fi

  release:
    needs: [verify, source]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Require immutable release policy
        env:
          GH_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=Immutable release preflight unavailable::Configure IMMUTABLE_RELEASES_READ_TOKEN with Administration read permission."
            exit 1
          fi
          if ! enabled="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/immutable-releases" \
            --jq '.enabled')"; then
            echo "::error title=Immutable release preflight failed::The repository setting could not be read; no release was created."
            exit 1
          fi
          if [ "$enabled" != "true" ]; then
            echo "::error title=Immutable releases disabled::Enable release immutability in repository settings before retrying; this workflow never changes that setting."
            exit 1
          fi

      - name: Build and verify release artifacts
        run: npm run release:artifacts -- --tag "$GITHUB_REF_NAME"

      - name: Sign build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: release/SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release/*.tgz
          release/SHA256SUMS
          release/manifest.json
          --verify-tag
          --title "RepoLens $GITHUB_REF_NAME"
          --generate-notes

      - name: Verify published release immutability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          immutable="$(gh api \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '.immutable')"
          if [ "$immutable" != "true" ]; then
            echo "::error title=Release immutability verification failed::GitHub did not report the published release as immutable."
            exit 1
          fi
