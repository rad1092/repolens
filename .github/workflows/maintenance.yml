name: RepoLens maintenance

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Inspect repository maintenance
        id: repolens
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          target: "."
          config: ".repolens.json"
          fail-on: critical

      - name: Upload standalone reports
        if: always() && steps.repolens.outputs.report-json != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: repolens-report
          path: |
            ${{ steps.repolens.outputs.report-json }}
            ${{ steps.repolens.outputs.report-html }}
            ${{ steps.repolens.outputs.report-markdown }}
          if-no-files-found: error
          retention-days: 14
