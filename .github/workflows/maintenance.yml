name: RepoLens maintenance

on:
  pull_request:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect repository maintenance
        id: repolens
        uses: ./
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          target: "."
          config: ".repolens.json"
          fail-on: critical

      - name: Upload standalone reports
        if: always() && steps.repolens.outputs.report-json != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: repolens-report
          path: |
            ${{ steps.repolens.outputs.report-json }}
            ${{ steps.repolens.outputs.report-html }}
            ${{ steps.repolens.outputs.report-markdown }}
          if-no-files-found: error
          retention-days: 14
