name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE*'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: Check every supported Node.js version
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJSON(inputs.full_matrix && '["20.11.0","22","24"]' || '["22"]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test
        run: npm run ci
